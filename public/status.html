<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04060c">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#04060c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RideWorld">
<title>RideWorld status</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* the redesign's look (2026-10-27): ink with the brand's glows, glass cards, italic condensed numbers */
:root { --bg:#04060c; --panel:rgba(17,22,36,.58); --line:rgba(255,255,255,.1); --stroke:rgba(255,255,255,.12); --fg:#f5f7fc; --muted:#a6b0c6; --dim:#6f7a94;
  --accent:#ff6a1a; --grad:linear-gradient(120deg,#ff8a1e 0%,#ff5a3c 45%,#ff2e7e 100%); --grad-text:linear-gradient(100deg,#ffb057 0%,#ff6a1a 40%,#ff3d86 100%);
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --num:"Barlow Semi Condensed",Inter,system-ui,sans-serif; color-scheme:dark; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; color:var(--fg); font:15px/1.45 Inter, system-ui, -apple-system, sans-serif; padding:24px 16px 40px; -webkit-font-smoothing:antialiased;
  background:radial-gradient(60vmax 45vmax at 0% 0%, rgba(255,106,26,.18), transparent 60%), radial-gradient(60vmax 45vmax at 100% 30%, rgba(255,46,126,.12), transparent 60%),
    radial-gradient(50vmax 40vmax at 50% 100%, rgba(139,92,246,.10), transparent 60%), var(--bg); background-attachment:fixed; }
main { max-width:1200px; margin:0 auto; }
@keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; animation:rise .6s cubic-bezier(.2,.8,.2,1) both; }
h1 { margin:0; display:flex; align-items:center; gap:0; font-family:var(--num); font-style:italic; font-weight:800; font-size:30px; text-transform:uppercase; letter-spacing:.005em; }
h1::before { content:""; width:12px; height:12px; margin-right:10px; border-radius:50%; background:var(--grad); box-shadow:0 0 14px rgba(255,90,60,.8); }
h1 span { background:var(--grad-text); -webkit-background-clip:text; background-clip:text; color:transparent; }
#updated { color:var(--muted); font-size:13px; padding:6px 12px; border-radius:999px; background:var(--panel); border:1px solid var(--stroke); }
#updated.stale { color:var(--bad); border-color:rgba(248,113,113,.5); }
h2 { font-size:11px; font-weight:800; color:var(--dim); text-transform:uppercase; letter-spacing:.16em; margin:28px 4px 10px; }
.cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:12px; }
.card, .scroll, #map { background:var(--panel); border:1px solid var(--stroke); border-radius:18px; box-shadow:0 18px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%); animation:rise .6s cubic-bezier(.2,.8,.2,1) both; }
.card { padding:14px 16px; transition:transform .3s cubic-bezier(.2,.8,.2,1), border-color .3s; }
.card:hover { transform:translateY(-2px); border-color:rgba(255,255,255,.22); }
.card b { display:block; font-family:var(--num); font-style:italic; font-weight:700; font-size:34px; font-variant-numeric:tabular-nums; line-height:1.1; }
.card small { color:var(--dim); font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.14em; }
.card .sub { color:var(--muted); font-size:12px; margin-top:2px; }
#map { height:380px; overflow:hidden; background:#1b2030; }
#map .leaflet-tile-pane { filter:brightness(.85) saturate(.9); }
.scroll { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
th { color:var(--dim); font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.12em; }
tbody tr, tr { transition:background .15s; } tr:hover td { background:rgba(255,255,255,.03); }
tr:last-child td { border-bottom:0; }
td.num, th.num { text-align:right; }
.pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:700; border:1px solid var(--stroke); }
.pill.ride { color:#052e1f; background:var(--ok); border-color:var(--ok); box-shadow:0 0 10px rgba(52,211,153,.45); }
.pill.pause { color:#3b2600; background:var(--warn); border-color:var(--warn); }
.pill.sim { color:var(--muted); }
.muted { color:var(--muted); }
.empty { padding:16px; color:var(--muted); }
.bar { height:6px; background:rgba(255,255,255,.1); border-radius:3px; overflow:hidden; min-width:80px; }
.bar i { display:block; height:100%; background:var(--grad); border-radius:3px; box-shadow:0 0 8px rgba(255,90,60,.6); }
#err { display:none; background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.55); color:#fecaca; border-radius:14px; padding:10px 14px; margin-bottom:12px; }
.leaflet-container { font:inherit; }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head><body><main>
<header><h1>Ride<span>World</span> status</h1><div id="updated">Loading…</div></header>
<div id="err"></div>

<div class="cards" id="cards"></div>

<h2>Where they are</h2>
<div id="map"></div>

<h2>Online now</h2>
<div class="scroll"><table id="online"></table></div>

<h2>Riders</h2>
<div class="scroll"><table id="people"></table></div>

<h2>Latest rides</h2>
<div class="scroll"><table id="recent"></table></div>

<h2>Server</h2>
<div class="cards" id="server"></div>
</main>
<script src="/js/status.js"></script>
</body></html>
